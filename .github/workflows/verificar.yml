# Verificação contínua do site a cada push/PR: regenera o index.html, confere que o
# site/ versionado está atualizado e roda os testes Playwright (capturas ficam como artefato).
# A publicação é feita pelo Vercel (integração com o GitHub, pasta site/ — ver vercel.json).
name: Verificar site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Gerar, conferir e testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerar o site
        run: python -m geradores.site.build
      - name: Conferir que site/ versionado está atualizado
        run: git diff --exit-code --stat -- site/
      - name: Instalar Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Testar (overflow, erros de console, capturas)
        run: python -m geradores.site.test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas
          path: build/shots
          retention-days: 14
